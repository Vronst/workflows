name: Lint Check

on:
  workflow_call:

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VALIDATE_ALL_CODEBASE: false

          # Deliberately no VALIDATE_<LANGUAGE> overrides here: this workflow
          # is shared across Python, Rust, PHP and JS/TS repos. Setting any
          # single VALIDATE_<LANGUAGE>=true flips super-linter into opt-in
          # mode, silently disabling every other language's linters (e.g. a
          # Python-only override made a pure-Rust repo's lint job pass green
          # without ever running clippy/rustfmt). Leave unset so it
          # auto-detects and lints whatever languages are actually present.
