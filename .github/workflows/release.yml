name: Create Release on Tag

on:
  workflow_call: # Required to make it callable by customer repos

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial so the workflow can generate and publish releases in the customer's repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history + tags so we can diff against the previous release

      - name: Build categorized release notes from commit prefixes
        id: notes
        run: |
          TAG_NAME="${{ github.ref_name }}"

          # Find the nearest tag reachable from this one's parent, by commit
          # ancestry -- not `git tag --sort=-creatordate`, which is fragile
          # here: for lightweight tags, "creatordate" is the tagged commit's
          # date, and two releases cut within the same second (a scripted
          # release, or just two quick tags same day) tie and can sort in
          # the wrong order. Fails harmlessly to empty for the very first
          # tag, or a tag on a repo's first commit (no parent at all).
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)

          if [ -z "$PREV_TAG" ]; then
            # First tagged release ever -- there's no "since last release"
            # story to tell, and categorizing the *entire* development
            # history as if it were user-facing changes (months of
            # "fix: linting", merge commits, etc.) is misleading rather
            # than informative. Keep it simple instead.
            echo "No previous tag found -- treating this as the initial release."
            {
              echo "## 🎉 Initial Release"
              echo
              echo "This is the first tagged release of this project."
            } > release_notes.md
            cat release_notes.md
            exit 0
          fi

          echo "Diffing $PREV_TAG..$TAG_NAME"
          LOG=$(git log --pretty=format:"%s|%h" "$PREV_TAG..$TAG_NAME")

          FEATURES=""
          FIXES=""
          CHORES=""
          OTHER=""

          while IFS='|' read -r subject hash; do
            [ -z "$subject" ] && continue
            lc=$(printf '%s' "$subject" | tr '[:upper:]' '[:lower:]')
            case "$lc" in
              feat:*|feature:*)
                msg=$(printf '%s' "$subject" | sed -E 's/^[^:]+:[[:space:]]*//')
                FEATURES="${FEATURES}- ${msg} (${hash})"$'\n'
                ;;
              fix:*)
                msg=$(printf '%s' "$subject" | sed -E 's/^[^:]+:[[:space:]]*//')
                FIXES="${FIXES}- ${msg} (${hash})"$'\n'
                ;;
              chore:*)
                msg=$(printf '%s' "$subject" | sed -E 's/^[^:]+:[[:space:]]*//')
                CHORES="${CHORES}- ${msg} (${hash})"$'\n'
                ;;
              *)
                OTHER="${OTHER}- ${subject} (${hash})"$'\n'
                ;;
            esac
          done <<< "$LOG"

          {
            echo "## What's Changed"
            if [ -n "$FEATURES" ]; then
              printf '\n### 🚀 Features\n%s' "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              printf '\n### 🐛 Fixes\n%s' "$FIXES"
            fi
            if [ -n "$CHORES" ]; then
              printf '\n### 🧹 Chores\n%s' "$CHORES"
            fi
            if [ -n "$OTHER" ]; then
              printf '\n### Other\n%s' "$OTHER"
            fi
            # PREV_TAG is always set here -- the empty case already
            # returned above.
            printf '\n**Full Changelog**: %s...%s\n' "$PREV_TAG" "$TAG_NAME"
          } > release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ github.ref_name }}"

          echo "Creating release for tag: $TAG_NAME"

          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
