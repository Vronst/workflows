name: Create Release on Tag

on:
  workflow_call: # Required to make it callable by customer repos

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial so the workflow can generate and publish releases in the customer's repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so GitHub can accurately generate the release changelog notes

      - name: Generate Release Notes & Create GitHub Release
        run: |
          TAG_NAME="${{ github.ref_name }}"

          echo "Creating release for tag: $TAG_NAME"

          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
